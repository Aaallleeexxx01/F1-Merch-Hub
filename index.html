<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop Gear | F1 Merchandise Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ---------- HEADER ---------- -->
  <header>
    <h1>F1 Merch Hub</h1> <!-- Changed name to match your other files -->
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
      <a href="profile.html" id="nav-profile" style="display: none;">Profile</a>
      <a href="login.html" id="nav-login">Login</a>
    </nav>

<script>
  // Check memory instantly to prevent flickering
  const isLogged = localStorage.getItem('isLoggedIn');
  const isAdmin = localStorage.getItem('isAdmin'); 

  if (isLogged === 'true') {
    document.getElementById('nav-profile').style.display = 'inline-block';
    document.getElementById('nav-login').style.display = 'none';
  } else {
    document.getElementById('nav-profile').style.display = 'none';
    document.getElementById('nav-login').style.display = 'inline-block';
  }

  // Handle Admin Button Instantly
  const navAdmin = document.getElementById('nav-admin');
  if (navAdmin) {
    if (isAdmin === 'true') {
      navAdmin.style.display = 'inline-block';
    } else {
      navAdmin.style.display = 'none';
    }
  }
</script>
  </header>

  <!-- ---------- HERO SECTION ---------- -->
  <section class="hero">
    <div class="hero-content">
      <h2>Race-Ready F1 Merchandise</h2>
      <p>Official fan gear inspired by Formula 1 speed and style.</p>
      <button onclick="location.href='shop.html'">Shop Now</button> <!-- Added button link -->
    </div>
  </section>

  <!-- ---------- PRODUCTS SECTION ---------- -->
  <section class="products">
      <h2>New Arrivals</h2> <div class="product-grid">
      </div>
  </section>

  <!-- ---------- FOOTER ---------- -->
  <footer>
    <p>&copy; 2025 F1 Merch Hub. All rights reserved.</p> <!-- Standardized footer text -->
  </footer>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
