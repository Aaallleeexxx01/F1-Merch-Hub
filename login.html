<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | F1 Merch Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>F1 Merch Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
      <a href="profile.html" id="nav-profile" style="display: none;">Profile</a>
      <a href="login.html" class="active" id="nav-login">Login</a>
    </nav>

    <script>
      // Check memory instantly to prevent flickering
      const isLogged = localStorage.getItem('isLoggedIn');
      if (isLogged === 'true') {
        document.getElementById('nav-profile').style.display = 'inline-block';
        document.getElementById('nav-login').style.display = 'none';
      } else {
        document.getElementById('nav-profile').style.display = 'none';
        document.getElementById('nav-login').style.display = 'inline-block';
      }
    </script>
  </header>

  <section class="login-container">
    <div class="login-box">
      <h2>Login to Your Account</h2>
      <form id="login-form">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </form>
      
      <p class="signup-text">Don’t have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 F1 Merch Hub. All rights reserved.</p>
  </footer>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
