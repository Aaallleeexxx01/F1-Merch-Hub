<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | F1 Merch Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>F1 Merch Hub</h1>
    <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
  
    <a href="profile.html" id="nav-profile" style="display: none;">Profile</a>
    <a href="login.html" id="nav-login">Login</a>
    </nav>
  <script>
  // Check memory instantly to prevent flickering
  const isLogged = localStorage.getItem('isLoggedIn');
  const isAdmin = localStorage.getItem('isAdmin'); 

  if (isLogged === 'true') {
    document.getElementById('nav-profile').style.display = 'inline-block';
    document.getElementById('nav-login').style.display = 'none';
  } else {
    document.getElementById('nav-profile').style.display = 'none';
    document.getElementById('nav-login').style.display = 'inline-block';
  }

  // Handle Admin Button Instantly
  const navAdmin = document.getElementById('nav-admin');
  if (navAdmin) {
    if (isAdmin === 'true') {
      navAdmin.style.display = 'inline-block';
    } else {
      navAdmin.style.display = 'none';
    }
  }
</script>
  </header>

  <section class="admin-container">
    <div class="admin-box">
      <h2>Admin Dashboard</h2>
      <p class="admin-subtitle">Add a new product to the store catalog.</p>
      
      <form id="add-product-form">
        <div class="form-group">
          <label for="product-title">Product Title:</label>
          <input type="text" id="product-title" placeholder="e.g. Red Bull Racing Cap" required>
        </div>

        <div class="form-group">
          <label for="product-price">Price ($):</label>
          <input type="number" id="product-price" step="0.01" placeholder="e.g. 29.99" required>
        </div>

        <div class="form-group">
          <label for="product-image">Image URL:</label>
          <input type="url" id="product-image" placeholder="https://..." required>
        </div>

        <div class="form-group">
          <label for="product-desc">Description:</label>
          <textarea id="product-desc" rows="4" placeholder="Enter product details..." required></textarea>
        </div>

        <button type="submit" class="admin-btn">Add Product</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 F1 Merch Hub. All rights reserved.</p>
  </footer>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
