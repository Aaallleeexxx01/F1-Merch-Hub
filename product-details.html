<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | F1 Merch Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>F1 Merch Hub</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="admin.html" id="nav-admin" style="display: none;">Admin</a>
      <a href="profile.html" id="nav-profile" style="display: none;">Profile</a>
      <a href="login.html" id="nav-login">Login</a>
    </nav>

    <script>
      // Check memory instantly to prevent flickering
      const isLogged = localStorage.getItem('isLoggedIn');
      if (isLogged === 'true') {
        document.getElementById('nav-profile').style.display = 'inline-block';
        document.getElementById('nav-login').style.display = 'none';
      } else {
        document.getElementById('nav-profile').style.display = 'none';
        document.getElementById('nav-login').style.display = 'inline-block';
      }
    </script>
  </header>

<div class="product-main">
      <div class="product-image">
        <img id="detail-img" src="" alt="Product Image"> 
      </div>
      <div class="product-info">
        <h2 id="detail-title">Loading...</h2>
        <p class="price" id="detail-price"></p>
        
        <p class="description" id="detail-desc"></p>
        
        <div id="admin-controls" style="margin-bottom: 20px;"></div>

        <button class="add-cart-btn">Add to Cart</button>
      </div>
    </div>

    <section class="reviews-section">
      </section>
  </div>

  <footer>
    <p>&copy; 2025 F1 Merch Hub. All rights reserved.</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/details.js"></script> </body>
</body>
</html>
