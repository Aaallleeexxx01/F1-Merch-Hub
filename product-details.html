<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | F1 Merch Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>F1 Merch Hub</h1>
  </header>

<div class="product-main">
      <div class="product-image">
        <img id="detail-img" src="" alt="Product Image"> 
      </div>
      <div class="product-info">
        <h2 id="detail-title">Loading...</h2>
        <p class="price" id="detail-price"></p>
        
        <p class="description" id="detail-desc"></p>
        
        <div id="admin-controls" style="margin-bottom: 20px;"></div>

        <button class="add-cart-btn">Add to Cart</button>
      </div>
    </div>

    <section class="reviews-section">
      <h3>Rate this Product</h3>
      <div class="avg-rating" id="avg-display">
        Average: <span>--</span> / 5
      </div>
      
      <div class="star-container" id="star-box">
        <span class="star" data-value="5">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="1">★</span>
      </div>
      <p id="rate-msg" style="font-size:0.9rem; color:#aaa; margin-top:10px;">Tap a star to rate</p>
    </div>
      </section>
  </div>

  <footer>
    <p>&copy; 2025 F1 Merch Hub. All rights reserved.</p>
  </footer>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/details.js"></script> </body>
</body>
</html>
